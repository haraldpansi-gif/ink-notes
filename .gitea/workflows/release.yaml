name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Packages & Publish to Gitea
    # Hinweis zum Gitea act_runner:
    # Standardmäßig 'ubuntu-latest'. Falls Ihr Runner unter einem anderen Label registriert ist
    # (z. B. 'linux', 'ubuntu-24.04' oder 'host'), passen Sie dieses Label an.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install System Packaging Tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            fi
          fi
          $SUDO apt-get update -y
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            squashfs-tools \
            dpkg-dev \
            curl \
            python3

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.11.0
        with:
          toolchain: stable
          # Die Action installiert mit --profile minimal; ohne diese Komponenten
          # schlagen cargo fmt und cargo clippy in den Quality Gates sofort fehl
          components: rustfmt, clippy
          cache: true

      - name: Install rsign2 (Release-Signatur)
        # RUSTFLAGS leeren: die Toolchain-Action setzt -D warnings, das soll nicht für rsign2 gelten
        run: RUSTFLAGS="" cargo install rsign2 --locked --version 0.6.7

      - name: Code Quality & Testing (Quality Gates)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build Release Artifacts (.deb, .AppImage, SHA256SUMS.txt + .minisig)
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-release.sh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          INK_NOTES_REQUIRE_SIGNATURE: "1"

      - name: Publish Release to Gitea
        run: |
          ./scripts/publish-gitea-release.sh
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          GITEA_SERVER: ${{ github.server_url }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}

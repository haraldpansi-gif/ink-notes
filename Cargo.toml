[package]
name = "ink-notes"
version = "0.1.0"
edition = "2021"

[dependencies]
# Fenster- & Event-Handling (Wayland/X11, Stylus)
winit = { version = "0.29", features = ["rwh_06"] }

# Low-Level GPU-Rendering (Vulkan/Direct3D12 via WSLg)
wgpu = "0.19"

# Daten-Casting für GPU-Buffer
bytemuck = { version = "1.16", features = ["derive"] }

# Vektor-Mathematik
glam = { version = "0.27", features = ["serde"] }

# Asynchroner Starter für wgpu-Device-Setup
pollster = "0.3"

# PDF-Vektorexport
printpdf = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Immediate-Mode UI (Toolbar & Menüs)
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = { version = "0.27", default-features = false, features = ["links"] }
webbrowser = "0.8"

[profile.dev]
opt-level = 1 # Erhöht Rendering-Performance auch im Debug-Modus

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
